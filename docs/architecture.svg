<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <rect width="800" height="600" fill="#0d1117" />
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
        </marker>
    </defs>
    <rect x="300" y="50" width="200" height="60" rx="8" fill="#238636" />
    <text x="400" y="85" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Client (Browser)</text>
    <line x1="400" y1="110" x2="400" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="250" y="170" width="300" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <text x="400" y="200" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Server (XAMPP / Apache)</text>
    <rect x="280" y="220" width="110" height="50" rx="4" fill="#1f6feb" />
    <text x="335" y="250" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">Frontend UI</text>
    <text x="335" y="265" fill="#c9d1d9" font-family="sans-serif" font-size="10" text-anchor="middle">HTML/CSS/JS</text>
    <rect x="410" y="220" width="110" height="50" rx="4" fill="#8957e5" />
    <text x="465" y="250" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">Backend API</text>
    <text x="465" y="265" fill="#c9d1d9" font-family="sans-serif" font-size="10" text-anchor="middle">Core PHP 8</text>
    <rect x="280" y="285" width="240" height="40" rx="4" fill="#238636" />
    <text x="400" y="310" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">Auth &amp; Session Management</text>
    <line x1="400" y1="350" x2="400" y2="420" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="300" y="420" width="200" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <text x="400" y="455" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Database</text>
    <text x="400" y="475" fill="#c9d1d9" font-family="sans-serif" font-size="14" text-anchor="middle">MySQL (phpMyAdmin)</text>
</svg>
